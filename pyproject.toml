[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentspec"
version = "0.4.0"
description = "Token-efficient project state and task DAG framework for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tiktoken>=0.5.0",
    "rich>=13.0.0"
]

[project.scripts]
aspec = "agentspec.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
